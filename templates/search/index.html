{% extends "base.html" %}

{% block content %}
<div class="search-container">
    <div class="logout-btn">
        <button class="secondary" id="logoutBtn">로그아웃</button>
    </div>

    <!-- 검색 영역 -->
    <div class="search-section">
        <h2>연락처 검색</h2>
        <div class="form-group">
            <label for="searchInput">검색어 입력</label>
            <div class="search-group">
                <input type="text" id="searchInput" placeholder="이름, 전화번호, 이메일로 검색...">
                <button id="searchBtn">검색</button>
                <button class="secondary" id="resetBtn">전체보기</button>
            </div>
        </div>
    </div>

    <!-- 연락처 추가 영역 -->
    <div class="add-contact-section">
        <h2>새 연락처 추가</h2>
        <form id="addContactForm">
            <div class="form-group">
                <label for="contactName">이름</label>
                <input type="text" id="contactName" name="name" placeholder="연락처 이름" required>
            </div>
            <div class="form-group">
                <label for="contactPhone">전화번호</label>
                <input type="tel" id="contactPhone" name="phone" placeholder="010-1234-5678" required>
            </div>
            <div class="form-group">
                <label for="contactEmail">이메일</label>
                <input type="email" id="contactEmail" name="email" placeholder="example@example.com" required>
            </div>
            <button type="submit">추가</button>
        </form>
    </div>

    <!-- 메시지 표시 영역 -->
    <div id="message"></div>

    <!-- 연락처 목록 테이블 -->
    <div class="contacts-section">
        <h2>연락처 목록</h2>
        <table id="contactsTable">
            <thead>
                <tr>
                    <th>이름</th>
                    <th>전화번호</th>
                    <th>이메일</th>
                </tr>
            </thead>
            <tbody id="contactsBody">
                <tr class="no-data">
                    <td colspan="3">연락처를 불러오는 중...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="/static/search.js"></script>
{% endblock %}
